[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "textkit"
version = "0.3.0"
description = "Small text helpers: slugs, truncation, durations, case conversion."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["textkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
